name = "cpcofc"
main = "worker.js"
compatibility_date = "2025-04-14"
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "MEMBERS_KV"
id = "89ef8b41fc4f488bbc59668a617b8c05"

# ── Staging ────────────────────────────────────────────────────────────────
# Deployed with:  npx wrangler deploy --env test
# Lands at:       https://cpcofc-test.zekenburton.workers.dev
#
# Deliberately a SEPARATE Worker and a SEPARATE KV namespace. Staging must
# never read or write the real member records — the whole point is to be able
# to upload a throwaway directory and click Deny on accounts without touching
# anyone's actual account.
#
# Secrets are per-environment too, so ADMIN_EMAILS has to be set twice:
#   npx wrangler secret put ADMIN_EMAILS              (production)
#   npx wrangler secret put ADMIN_EMAILS --env test   (staging)
[env.test]
name = "cpcofc-test"
workers_dev = true

[env.test.assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[[env.test.kv_namespaces]]
binding = "MEMBERS_KV"
# Created with:  npx wrangler kv namespace create MEMBERS_KV_TEST
id = "d268d47bd63b442998b5357388921904"
